<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="theme-color" content="#a2569c"><title>Cloudy Notes</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<style>
:root{--pink:#ff1f7a;--pink2:#c2185b;--card:rgba(255,255,255,.92);--ink:#4a1238;--mut:#8a5a7a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:"Trebuchet MS","Segoe UI",sans-serif;color:var(--ink);background:#a2569c url(assets/background.jpg) center top/cover fixed;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:480px;margin:0 auto;padding:12px 14px}
.logo{display:block;width:100%;max-width:340px;margin:4px auto 10px}
.panel{background:var(--card);border-radius:20px;padding:14px;box-shadow:0 6px 20px rgba(80,0,60,.3);margin-bottom:14px}
h2{margin:0 0 10px;font-size:1.1rem;color:var(--pink2)}
label{display:block;font-weight:700;font-size:.85rem;margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:2px solid #f3b6d6;border-radius:12px;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:64px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pink)}
.err{border-color:#e53935!important}
.btn{font:inherit;font-weight:800;letter-spacing:.5px;color:var(--pink);background:linear-gradient(#fff,#ffd3e6);border:2px solid var(--pink);border-radius:14px;padding:11px 20px;cursor:pointer;box-shadow:0 3px 0 #d81b73}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #d81b73}.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row .btn{flex:0 0 auto;padding:9px 14px}
#newcat{display:none;margin-top:8px}
.bar{display:flex;gap:8px;margin-bottom:10px}.bar input{flex:2}.bar select{flex:1.2}
.note{position:relative;background:#fff;border:2px solid #f3b6d6;border-radius:14px;padding:10px 12px 10px 38px;margin-bottom:8px;cursor:pointer;user-select:none;-webkit-user-select:none;transition:.15s}
.note.sel{border-color:var(--pink);background:#ffe6f1;box-shadow:0 0 0 3px rgba(255,31,122,.3);transform:scale(1.01)}
.note .star{position:absolute;left:10px;top:9px;font-size:1.3rem;color:#ffb300;text-shadow:0 0 4px #ffe082}
.note b{display:block;font-size:1rem}.note p{margin:3px 0 6px;font-size:.88rem;color:var(--mut);white-space:pre-wrap;word-break:break-word}
.tags{display:flex;gap:6px;flex-wrap:wrap;font-size:.75rem}.tag{background:#fde0ee;color:var(--pink2);padding:2px 9px;border-radius:99px;font-weight:700}
.tag.d{background:#e8e0fd;color:#4a2a9a}.tag.late{background:#ffd9d6;color:#b71c1c}
.empty{text-align:center;color:var(--mut);padding:18px 6px;font-size:.95rem}
.hint{font-size:.75rem;color:var(--mut);margin:-4px 0 8px}
.actions{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:14px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(120,20,90,.55);backdrop-filter:blur(6px);z-index:5}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-90px);max-width:90%;padding:11px 18px;border-radius:14px;color:#fff;font-weight:700;font-size:.9rem;box-shadow:0 6px 18px rgba(0,0,0,.3);transition:.3s;z-index:9;text-align:center}
#toast.show{transform:translate(-50%,0)}#toast.ok{background:#2e9e5b}#toast.er{background:#d32f2f}#toast.in{background:#7b3fa0}
</style></head><body><div class="wrap">
<img class="logo" alt="Cloudy Notes" src="assets/logo.png">
<div class="panel"><h2>Nova anotação</h2>
<label for="t">Título *</label><input id="t" maxlength="80" placeholder="Ex.: Prova de matemática">
<label for="d">Descrição *</label><textarea id="d" maxlength="400" placeholder="O que precisa ser feito?"></textarea>
<label for="c">Categoria</label><select id="c"></select>
<div id="newcat" class="row"><input id="nc" maxlength="24" placeholder="Nome da categoria"><button class="btn" id="addc" type="button">Criar</button><button class="btn" id="canc" type="button">✕</button></div>
<label for="dt">Data de conclusão (DD/MM/AAAA) *</label><input id="dt" type="date" lang="pt-BR">
<div style="margin-top:14px;text-align:center"><button class="btn" id="save" type="button">SALVAR</button></div></div>
<div class="panel"><h2>Minhas Anotações</h2>
<div class="bar"><input id="q" type="search" placeholder="Pesquisar anotação..."><select id="f" aria-label="Filtrar categoria"></select></div>
<div class="hint">Toque ou segure uma anotação para selecioná-la.</div>
<div id="list"></div></div></div>
<div class="actions"><button class="btn" id="fav" disabled>FAVORITAR</button><button class="btn" id="del" disabled>EXCLUIR</button></div>
<div id="toast" role="status"></div>
<script>
const KN='cloudy_notes',KC='cloudy_cats',BASE=['Escola','Projetos','Lembretes','Outros'];
let notes=[],cats=[],sel=null;
const $=id=>document.getElementById(id);
const CAP=window.Capacitor,PR=(CAP&&CAP.isNativePlatform&&CAP.isNativePlatform())?CAP.registerPlugin('Preferences'):null;
function ls(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
async function load(k,d){if(PR){try{const r=await PR.get({key:k});if(r&&r.value)return JSON.parse(r.value)}catch(e){}}return ls(k,d)}
function store(k,v){const s=JSON.stringify(v);let ok=false;try{localStorage.setItem(k,s);ok=true}catch(e){}
 if(PR){PR.set({key:k,value:s}).catch(()=>toast('Não foi possível salvar.','er'))}else if(!ok)toast('Não foi possível salvar.','er')}
const allCats=()=>BASE.concat(cats);
let tt;function toast(m,t){const e=$('toast');e.textContent=m;e.className='show '+(t||'in');clearTimeout(tt);tt=setTimeout(()=>e.className=t||'in',2600)}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>d?d.split('-').reverse().join('/'):'';
function fillSelects(keepC,keepF){
 const c=$('c'),f=$('f');
 c.innerHTML=allCats().map(x=>`<option>${esc(x)}</option>`).join('')+'<option value="__add__">➕ Adicionar categoria</option>';
 f.innerHTML='<option value="">Todas</option>'+allCats().map(x=>`<option>${esc(x)}</option>`).join('');
 if(keepC)c.value=keepC;if(keepF)f.value=keepF;
}
$('c').onchange=()=>{if($('c').value==='__add__'){$('newcat').style.display='flex';$('nc').focus()}else $('newcat').style.display='none'};
$('canc').onclick=()=>{$('newcat').style.display='none';$('c').value=BASE[0]};
$('addc').onclick=()=>{
 const n=$('nc').value.trim();
 if(!n){toast('Digite o nome da categoria.','er');return}
 if(allCats().some(x=>x.toLowerCase()===n.toLowerCase())){toast('Essa categoria já existe.','er');return}
 cats.push(n);store(KC,cats);fillSelects(n,$('f').value);
 $('nc').value='';$('newcat').style.display='none';toast('Categoria “'+n+'” criada!','ok');
};
$('save').onclick=()=>{
 const t=$('t').value.trim(),d=$('d').value.trim(),dt=$('dt').value,c=$('c').value;
 [['t',t],['d',d],['dt',dt]].forEach(([i,v])=>$(i).classList.toggle('err',!v));
 if(!t||!d||!dt){toast('Preencha título, descrição e data de conclusão.','er');return}
 if(c==='__add__'){toast('Crie a categoria ou escolha outra.','er');return}
 notes.unshift({id:Date.now()+''+Math.random().toString(36).slice(2,6),t,d,c,dt,fav:false});
 store(KN,notes);$('t').value=$('d').value=$('dt').value='';
 render();toast('Anotação salva com sucesso!','ok');
};
['t','d','dt'].forEach(i=>$(i).oninput=()=>$(i).classList.remove('err'));
$('q').oninput=render;$('f').onchange=render;
function render(){
 const q=$('q').value.trim().toLowerCase(),f=$('f').value;
 const list=notes.filter(n=>(!f||n.c===f)&&(!q||n.t.toLowerCase().includes(q)||n.d.toLowerCase().includes(q)));
 if(sel&&!notes.some(n=>n.id===sel))sel=null;
 const today=new Date().toISOString().slice(0,10);
 $('list').innerHTML=list.length?list.map(n=>`<div class="note${n.id===sel?' sel':''}" data-id="${n.id}">${n.fav?'<span class="star">★</span>':''}<b>${esc(n.t)}</b><p>${esc(n.d)}</p><div class="tags"><span class="tag">${esc(n.c)}</span><span class="tag d${n.dt<today?' late':''}">📅 ${fmt(n.dt)}</span></div></div>`).join('')
 :`<div class="empty">${notes.length?'🔍 Nenhuma anotação encontrada.':'☁️ Nenhuma anotação cadastrada ainda.<br>Crie a primeira acima!'}</div>`;
 $('fav').disabled=$('del').disabled=!sel;
 const s=notes.find(n=>n.id===sel);$('fav').textContent=s&&s.fav?'DESFAVORITAR':'FAVORITAR';
}
let lp,moved;const L=$('list');
function pick(el){const id=el.dataset.id;sel=sel===id?null:id;render()}
L.addEventListener('click',e=>{const el=e.target.closest('.note');if(el&&!lp)pick(el);lp=false});
L.addEventListener('pointerdown',e=>{const el=e.target.closest('.note');if(!el)return;lp=false;
 clearTimeout(L._t);L._t=setTimeout(()=>{lp=true;sel=el.dataset.id;render();navigator.vibrate&&navigator.vibrate(30)},500)});
['pointerup','pointerleave','pointercancel','scroll'].forEach(ev=>L.addEventListener(ev,()=>clearTimeout(L._t)));
L.addEventListener('contextmenu',e=>e.preventDefault());
$('fav').onclick=()=>{const n=notes.find(x=>x.id===sel);if(!n)return;
 n.fav=!n.fav;store(KN,notes);render();toast(n.fav?'★ Adicionada aos favoritos!':'Removida dos favoritos.','ok')};
$('del').onclick=()=>{const n=notes.find(x=>x.id===sel);if(!n)return;
 if(n.fav){toast('Anotação favorita! Remova dos favoritos antes de excluir.','er');return}
 notes=notes.filter(x=>x.id!==sel);sel=null;store(KN,notes);render();toast('Anotação excluída.','in')};
(async()=>{notes=await load(KN,[]);cats=await load(KC,[]);fillSelects();render()})();
</script></body></html>
